name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONFIGURE: >-
    -G Ninja -DCMAKE_BUILD_TYPE=Release
    -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
    -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
  WINLIBS_RELEASE: 15.2.0posix-14.0.0-ucrt-r7
  WINLIBS_ZIP: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            timeout: 90
          - platform: linux
            runner: ubuntu-latest
            timeout: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - id: toolchain
        if: matrix.platform == 'windows'
        uses: actions/cache@v6
        with:
          path: C:\winlibs
          key: ${{ env.WINLIBS_ZIP }}
      - if: matrix.platform == 'windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/winlibs.zip" "https://github.com/brechtsanders/winlibs_mingw/releases/download/$WINLIBS_RELEASE/$WINLIBS_ZIP"
          7z x "$RUNNER_TEMP/winlibs.zip" -oC:/winlibs > /dev/null
      - if: matrix.platform == 'windows'
        run: echo 'C:\winlibs\mingw64\bin' >> "$GITHUB_PATH"
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-dev libxext-dev
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: package-${{ matrix.platform }}
          save: ${{ github.event_name == 'push' }}
      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        run: cmake -S . -B build $CONFIGURE
      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          cmake --build build
          cmake --build build --target libs
      - name: Configure (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        env:
          SSL_CERT_FILE: C:\Program Files\Git\mingw64\etc\ssl\certs\ca-bundle.crt
        run: cmake -S . -B build %CONFIGURE%
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          cmake --build build || exit /b 1
          cmake --build build --target libs
      - name: Assemble package
        run: |
          python tools/build_package.py --skip-build
          echo "$GITHUB_SHA" > "AnyPS5-${{ matrix.platform }}/COMMIT.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: AnyPS5-${{ matrix.platform }}
          path: AnyPS5-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    name: Publish latest release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: AnyPS5-*
      - name: Zip packages
        run: |
          for platform in windows linux; do
            (cd "AnyPS5-$platform" && zip -qr "../AnyPS5-$platform.zip" .)
          done
          ls -l AnyPS5-*.zip
      - name: Update the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest AnyPS5-windows.zip AnyPS5-linux.zip --prerelease --target "$GITHUB_SHA" --title "Latest package ($(echo "$GITHUB_SHA" | cut -c1-10))" --notes "Relinker, system libraries, launcher and tools built from main at $GITHUB_SHA. The launcher's Set up relinker downloads this automatically."
